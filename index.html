<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7efd9">
<title>진의 기록장</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐥</text></svg>">
<style>
/* =========================================================
   진의 기록장 — 스타일
   테마: data-theme (butter / cream / white / dark)
   포인트색: --accent 계열 (설정 > 디자인)
   ========================================================= */
:root{
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --fs:15px;
  --bg:#f7efd9; --bg2:#fbf5e6; --paper:#fffdf7; --card:#ffffff; --soft:#fdf8ea;
  --line:#efe4c9; --line2:#e3d4b0;
  --ink:#43392a; --ink2:#6e624f; --muted:#9a8e78;
  --accent:#f2c94c; --accent-d:#d9a92a; --accent-s:#fdf1c8; --accent-ink:#4a3708;
  --ok:#5f9e6e; --ok-s:#e6f3e8; --warn:#d0892f; --warn-s:#fbeedb; --bad:#c9584b; --bad-s:#fbe9e6; --info:#5b8db8; --info-s:#e5eff8;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(90,70,30,.05),0 8px 24px rgba(90,70,30,.07);
  --shadow-lg:0 24px 60px rgba(60,45,15,.22);
}
[data-theme=cream]{--bg:#f3eee4;--bg2:#f7f3eb;--paper:#fdfbf6;--soft:#f8f4ea;--line:#e8e0cf;--line2:#dcd1ba}
[data-theme=white]{--bg:#f4f4f2;--bg2:#f8f8f6;--paper:#ffffff;--soft:#f7f7f4;--line:#e9e7e1;--line2:#dcd9d0;--ink:#2f2d29;--ink2:#5c5952;--muted:#97938a}
[data-theme=dark]{--bg:#17161a;--bg2:#1c1b20;--paper:#222127;--card:#2a2930;--soft:#2f2e35;--line:#3a3941;--line2:#4a4952;--ink:#ecebe6;--ink2:#c3c0b7;--muted:#8d8a82;--accent-s:#3d3523;--accent-ink:#2a2006;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
[data-fs=s]{--fs:14px}[data-fs=l]{--fs:16.5px}

*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 15% 0%,var(--bg2),transparent 45%);min-height:100vh;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
a{color:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em}
::selection{background:var(--accent-s)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

/* ---------- 전체 틀 ---------- */
.stage{max-width:1400px;margin:0 auto;padding:22px 150px 40px 22px}
.shell{position:relative;display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--shadow);min-height:calc(100vh - 62px)}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:20px;align-self:start;background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:16px}
.main{min-width:0}

/* 프로필 */
.profile{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.avatar{width:120px;height:120px;border-radius:24px;background:var(--card);border:1px solid var(--line2);display:grid;place-items:center;font-size:52px;overflow:hidden;cursor:pointer;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar:hover::after{content:"사진 변경";position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.45);color:#fff;font-size:12px;padding:4px}
.p-name{font-size:19px;font-weight:800}
.p-sub{font-size:12.5px;color:var(--muted)}
.mini-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:13px}
.mini-box h4{font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.mini-row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;color:var(--ink2)}
.mini-row b{color:var(--ink)}
.lv{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.lv b{font-size:16px}

/* 오른쪽 인덱스 탭 */
.index{position:absolute;left:100%;top:26px;width:132px;display:flex;flex-direction:column;gap:5px;z-index:5}
.idx-title{font-size:11px;letter-spacing:.14em;color:var(--muted);padding:0 0 4px 12px}
.idx-group{display:flex;flex-direction:column}
.idx-main{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-left:0;border-radius:0 13px 13px 0;font-weight:700;font-size:13.5px;transition:background .15s,transform .15s;box-shadow:2px 2px 0 rgba(90,70,30,.04)}
.idx-main:hover{background:var(--accent-s);transform:translateX(2px)}
.idx-main.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.idx-main .chev{margin-left:auto;font-size:10px;opacity:.6}
.idx-subs{display:none;flex-direction:column;gap:1px;margin:4px 0 2px 0;padding:5px;background:var(--card);border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0}
.idx-group.open .idx-subs{display:flex}
.idx-sub{all:unset;cursor:pointer;padding:6px 9px;border-radius:8px;font-size:12.5px;color:var(--ink2)}
.idx-sub:hover{background:var(--accent-s)}
.idx-sub.on{background:var(--accent-s);color:var(--ink);font-weight:700}

/* ---------- 공통 컴포넌트 ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 2px 16px}
.page-head h2{font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px}
.page-head .desc{font-size:13px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{font-size:16px;font-weight:800;display:flex;gap:7px;align-items:center}
.card-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px;letter-spacing:.02em}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid>.card+.card{margin-top:0}
.span2{grid-column:span 2}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.right{text-align:right}
.center{text-align:center}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.hide{display:none!important}
.sep{height:1px;background:var(--line);margin:12px 0;border:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:1px solid var(--line2);background:var(--card);border-radius:var(--r-sm);font-weight:650;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s;line-height:1.3;text-decoration:none}
.btn:hover{background:var(--accent-s);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.danger{color:var(--bad);border-color:#efcdc7}
[data-theme=dark] .btn.danger{border-color:#6a3a35}
.btn.danger:hover{background:var(--bad-s);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-s)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:6px 8px;min-width:32px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.input,.select,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--line2);background:var(--card);border-radius:var(--r-sm);font-size:14px;min-height:38px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{min-height:90px;resize:vertical;line-height:1.6}
.input:focus,.select:focus{border-color:var(--accent-d);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.input::placeholder{color:var(--muted);opacity:.8}
input[type=checkbox],input[type=radio]{accent-color:var(--accent-d);width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;color:var(--ink2);font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.search{position:relative}
.search .input{padding-left:32px}
.search::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}

.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-size:14px;font-weight:650;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent-d)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.chip.click{cursor:pointer}.chip.click:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-s);border-color:var(--accent-d)}
.chip .x{cursor:pointer;opacity:.6}.chip .x:hover{opacity:1}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--ink2);white-space:nowrap}
.badge.ok{background:var(--ok-s);color:var(--ok)}.badge.warn{background:var(--warn-s);color:var(--warn)}.badge.bad{background:var(--bad-s);color:var(--bad)}.badge.info{background:var(--info-s);color:var(--info)}.badge.acc{background:var(--accent-s);color:var(--accent-ink)}
[data-theme=dark] .badge.acc{color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;background:var(--accent-d);border-radius:99px;transition:width .3s}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:2px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}

.empty{text-align:center;padding:34px 12px;color:var(--muted);font-size:14px}
.empty .e{font-size:30px;margin-bottom:6px}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer;border-radius:10px;padding-left:8px;padding-right:8px}
.li.click:hover{background:var(--soft)}
.li .t{font-weight:650}
.li.done .t{text-decoration:line-through;color:var(--muted)}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--soft);color:var(--ink2);font-weight:700;font-size:12.5px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:color-mix(in srgb,var(--soft) 60%,transparent)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-width:100%}
.tbl-wrap table{border:0}

/* 엑셀식 표 */
.sheet{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:760px}
.sheet th{position:sticky;top:0;z-index:2;background:var(--soft);font-size:12.5px;color:var(--ink2);font-weight:700;padding:8px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);text-align:left;cursor:pointer;user-select:none;white-space:nowrap}
.sheet th:last-child{border-right:0}
.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;height:36px;background:var(--card)}
.sheet td:last-child{border-right:0}
.sheet td>input,.sheet td>select{all:unset;box-sizing:border-box;width:100%;height:36px;padding:0 9px;font-size:13.5px}
.sheet td>select{cursor:pointer}
.sheet td:focus-within{outline:2px solid var(--accent-d);outline-offset:-2px;position:relative;z-index:1}
.sheet td.num>input{text-align:right;font-variant-numeric:tabular-nums}
.sheet tr.new td{background:var(--soft)}
.sheet tr.new td>input::placeholder{color:var(--muted)}
.sheet .rowno{width:38px;text-align:center;color:var(--muted);font-size:11.5px;background:var(--soft)}
.sheet tfoot td{background:var(--soft);font-weight:800;padding:0 9px;position:sticky;bottom:0}
.sheet .inc{color:var(--info)}.sheet .exp{color:var(--bad)}
.sheet td.del{width:34px;text-align:center}
.sheet td.del button{all:unset;cursor:pointer;opacity:0;padding:4px 8px}
.sheet tr:hover td.del button{opacity:.6}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(40,30,10,.38);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s}
.modal{background:var(--paper);border-radius:20px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:calc(100dvh - 36px);display:flex;flex-direction:column;border:1px solid var(--line);animation:pop .18s}
.modal.wide{width:min(980px,100%)}
.modal.narrow{width:min(420px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.modal-h h3{font-size:17px;font-weight:800}
.modal-b{padding:18px 20px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .left{margin-right:auto}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:pop .2s}

/* 미니룸 팝업 (작게 보기) */
.modal.pop{width:min(820px,100%)}
.modal.pop .modal-b{background:var(--bg2);padding:14px 16px}
.mini-pop{font-size:.94em}
.mini-pop .page-head{margin:0 0 10px}
.mini-pop .page-head h2{display:none}
.mini-pop .page-head .desc{margin:0}
.mini-pop .card{padding:14px;box-shadow:none}
.mini-pop .card+.card{margin-top:10px}
.mini-pop .kpi{padding:10px 12px}.mini-pop .kpi .v{font-size:19px}
.mini-pop .grid{gap:10px}
.mini-pop .shelf{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px 10px}
.mini-pop .cal .day{min-height:64px}
.mini-pop .bar-chart{height:130px}
.mini-pop .tbl-wrap{max-height:52vh}
.mini-pop .set-layout{grid-template-columns:minmax(0,1fr)}
/* ---------- 홈 ---------- */
.room{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);aspect-ratio:935/732;background:#fff4cf center/cover no-repeat;image-rendering:pixelated}
.hot{all:unset;position:absolute;cursor:pointer;border-radius:14px;transition:background .15s,box-shadow .15s}
.hot:hover,.hot:focus-visible{background:rgba(255,255,255,.22);box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 0 4px rgba(217,169,42,.55)}
.hot .lab{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);background:var(--card);border:1px solid var(--line2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;color:var(--ink)}
.hot:hover .lab,.hot:focus-visible .lab{opacity:1}
.today-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}

/* ---------- 독서 ---------- */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:16px 14px}
.book{cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.cover{aspect-ratio:2/3;border-radius:6px 10px 10px 6px;background:var(--soft);overflow:hidden;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 14px rgba(70,50,10,.12);border:1px solid rgba(0,0,0,.05);transition:transform .15s}
.book:hover .cover{transform:translateY(-3px)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px;font-size:12.5px;font-weight:800;line-height:1.35;color:#3c3020}
.cover .ph small{font-weight:600;opacity:.7;font-size:11px}
.cover .st{position:absolute;left:6px;top:6px}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(90deg,rgba(0,0,0,.12),transparent)}
.book .bt{font-size:12.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .ba{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reading-card{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;align-items:start}
.reading-card .cover{width:86px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px}
.bar-chart .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bar-chart .b i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:7px 7px 3px 3px;min-height:2px;position:relative}
.bar-chart .b i.alt{background:var(--info)}
.bar-chart .b em{font-style:normal;font-size:11px;color:var(--muted)}
.bar-chart .b b{font-size:11px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:26%;background:var(--card);border-radius:50%}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12.5px;min-width:140px;flex:1}
.legend div{display:flex;align-items:center;gap:7px}
.legend b{margin-left:auto}
.hbar{display:flex;flex-direction:column;gap:7px}
.hbar .r{display:grid;grid-template-columns:90px 1fr 54px;gap:8px;align-items:center;font-size:12.5px}
.hbar .r i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.receipt{width:330px;max-width:100%;margin:0 auto;background:#fffef9;color:#2d2a24;font-family:"D2Coding","Consolas","Courier New",monospace;padding:22px 20px;border-radius:4px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.6;position:relative}
.receipt::before,.receipt::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 5px 0,transparent 5px,#fffef9 5.5px) repeat-x;background-size:10px 8px}
.receipt::before{top:-8px;transform:rotate(180deg)}.receipt::after{bottom:-8px}
.receipt .hr{border-top:1px dashed #b5ae9d;margin:8px 0}
.receipt .c{text-align:center}
.receipt .ln{display:flex;justify-content:space-between;gap:8px}

/* ---------- 달력 ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);gap:1px}
.cal .wd{background:var(--soft);text-align:center;font-size:12px;font-weight:700;color:var(--ink2);padding:7px 0}
.cal .day{background:var(--card);min-height:96px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;transition:background .1s}
.cal .day:hover{background:var(--soft)}
.cal .day.out{background:color-mix(in srgb,var(--card) 60%,var(--bg));color:var(--muted)}
.cal .day .n{font-size:12.5px;font-weight:700;padding:1px 4px;align-self:flex-start;border-radius:6px}
.cal .day.today .n{background:var(--accent);color:var(--accent-ink)}
.cal .day.sun .n{color:var(--bad)}.cal .day.sat .n{color:var(--info)}
.cal .ev{font-size:11.5px;padding:1px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cal .more{font-size:11px;color:var(--muted);padding-left:4px}

/* ---------- 게임 ---------- */
.farm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:540px;margin:0 auto;padding:16px;background:#a9cf8f;border-radius:18px;border:3px solid #7fae68}
.plot{aspect-ratio:1;border-radius:12px;background:repeating-linear-gradient(0deg,#a8774f 0 9px,#93653f 9px 12px);border:3px solid #6d4a2c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:#fff7e3;font-weight:700;font-size:12px;text-shadow:0 1px 0 rgba(0,0,0,.3);position:relative}
.plot .ic{font-size:34px;text-shadow:none}
.plot .pg{position:absolute;left:10%;right:10%;bottom:10%;height:6px;background:rgba(0,0,0,.25);border-radius:3px;overflow:hidden}
.plot .pg i{display:block;height:100%;background:#ffe27a}
.plot.ready{box-shadow:0 0 0 3px #ffe27a}

/* ---------- 설정 ---------- */
.set-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:start}
.set-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:20px}
.set-nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.set-nav button:hover{background:var(--soft)}
.set-nav button.on{background:var(--accent-s);color:var(--ink);font-weight:700}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .l{flex:none;min-width:0}
.set-row .l b{display:block;font-size:14px;white-space:nowrap}
.set-row.col{flex-direction:column;align-items:stretch;gap:8px}
.set-row.col .chip-editor{justify-content:flex-start}
.set-row .l small{color:var(--muted);font-size:12.5px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--line2);border-radius:99px;transition:.2s;cursor:pointer}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--accent-d)}
.switch input:checked+i::after{transform:translateX(18px)}
.theme-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.theme-card{cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:8px;background:var(--card)}
.theme-card.on{border-color:var(--accent-d);box-shadow:0 0 0 3px var(--accent-s)}
.theme-card .pv{height:56px;border-radius:9px;display:grid;grid-template-columns:28% 1fr;overflow:hidden;border:1px solid rgba(0,0,0,.06)}
.theme-card .pv i{display:block}
.theme-card b{display:block;font-size:13px;margin-top:6px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:11.5px;color:var(--ink2)}
.swatch i{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line2)}
.swatch.on i{box-shadow:0 0 0 2px var(--ink)}
.chip-editor{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip-editor input{width:130px}

/* 오답노트·메모 이미지 */
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.block{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.block img{max-height:420px;object-fit:contain;border-radius:8px;background:var(--card);cursor:zoom-in}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer}
.drop:hover{border-color:var(--accent-d);background:var(--accent-s)}
.flash{max-width:440px;margin:0 auto;aspect-ratio:3/2;border-radius:20px;background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:20px;text-align:center}
.flash .w{font-size:40px;font-weight:800}
.flash .m{font-size:18px;color:var(--ink2)}
.drag-handle{cursor:grab;color:var(--muted);user-select:none;padding:0 4px}
tr.dragging{opacity:.4}
tr.drop-over td{box-shadow:inset 0 2px 0 var(--accent-d)}

/* ---------- 반응형 (태블릿·휴대폰) ---------- */
@media (max-width:1100px){
  .stage{padding:10px 10px 90px}
  .shell{grid-template-columns:minmax(0,1fr);padding:12px;border-radius:20px;gap:14px;min-height:auto}
  .index{position:sticky;top:0;left:auto;width:auto;flex-direction:row;overflow-x:auto;gap:6px;padding:8px 2px;margin:-4px -2px 0;background:var(--paper);z-index:20;grid-row:1;scrollbar-width:none}
  .index::-webkit-scrollbar{display:none}
  .idx-title{display:none}
  .idx-group{flex-direction:row;align-items:center;flex:none}
  .idx-main{border:1px solid var(--line);border-radius:99px;padding:8px 13px;box-shadow:none}
  .idx-main:hover{transform:none}
  .idx-main .chev{display:none}
  .idx-subs{display:none!important}
  .subbar{display:flex!important}
  .side{position:static;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center;padding:12px;grid-row:2}
  .main{grid-row:3}
  .profile{flex-direction:row;text-align:left;gap:12px}
  .avatar{width:64px;height:64px;font-size:30px;border-radius:16px}
  .side .mini-box.stats{display:none}
  .side .mini-box.upcoming{grid-column:1/-1}
  .side .mini-box.lvbox{margin:0}
  .home-only .side{display:grid}
}
.subbar{display:none;gap:6px;overflow-x:auto;margin:-4px 0 14px;padding-bottom:2px;scrollbar-width:none}
.subbar::-webkit-scrollbar{display:none}
.subbar button{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink2)}
.subbar button.on{background:var(--accent-s);border-color:var(--accent-d);color:var(--ink)}
@media (max-width:760px){
  html{font-size:calc(var(--fs) - .5px)}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .g4.keep2,.g3.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span2{grid-column:auto}
  .form{grid-template-columns:minmax(0,1fr)}
  .card{padding:14px;border-radius:14px}
  .page-head h2{font-size:19px}
  .today-grid{grid-template-columns:minmax(0,1fr)}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px}
  .cal .day{min-height:62px;padding:3px}
  .cal .ev{font-size:10px;padding:0 3px}
  .set-layout{grid-template-columns:minmax(0,1fr)}
  .set-nav{flex-direction:row;overflow-x:auto;position:static;gap:4px}
  .set-nav button{white-space:nowrap;padding:7px 11px;border:1px solid var(--line);border-radius:99px;font-size:13px}
  .theme-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .modal-bg{padding:0;align-items:flex-end}
  .modal,.modal.wide,.modal.narrow{width:100%;max-height:92dvh;border-radius:20px 20px 0 0}
  .set-row{flex-wrap:wrap}
  .kpi .v{font-size:20px}
  .reading-card{grid-template-columns:70px minmax(0,1fr)}
  .reading-card .cover{width:70px}
  .hide-m{display:none!important}
  .tbl.wide{min-width:640px}
  .tbl.wide td b{white-space:nowrap}
  .shell:not(.home-only) .side{display:none}
  .btn{padding:8px 12px}
}
@media print{
  .stage{padding:0}.side,.index,.page-head .actions,.no-print,.subbar{display:none!important}
  .shell{display:block;border:0;box-shadow:none;padding:0}
  body{background:#fff}
  .card{box-shadow:none;border:0}
}

</style>

    const d = j.data || {}; for (const [k, v] of Object.entries(j.images || {})) await Store.putImg(k, v);
    const out = [];
    for (const k of ['books', 'events', 'tasks', 'journals', 'retros', 'notes', 'meals', 'money', 'allowance', 'study', 'wrongNotes']) if (Array.isArray(d[k])) { const n = this.merge(D[k], d[k]); if (n) out.push(`${{ books: '책', events: '일정', tasks: '할 일', journals: '일기', retros: '회고', notes: '메모', meals: '식사', money: '가계부', allowance: '용돈', study: '공부', wrongNotes: '오답노트' }[k]} ${n}`); }
    if (d.vocab) for (const L of ['en', 'ja']) this.merge(D.vocab[L], d.vocab[L] || []);
    if (d.work) { for (const k of ['clients', 'filings', 'memos', 'calls', 'manuals', 'noticeForms']) this.merge(W()[k], d.work[k] || []); Object.assign(W().company, d.work.company || {}); }
    if (d.game) { const G = D.game; G.xp = Math.max(G.xp, d.game.xp || 0); G.coins = Math.max(G.coins, d.game.coins || 0); G.activity = Math.max(G.activity, d.game.activity || 0); this.merge(G.quests, d.game.quests || []); this.merge(G.realRewards, d.game.realRewards || []); }
    this.addUnique(D.noteFolders, d.noteFolders || []);
    return out.length ? out.join(' · ') + ' 추가' : '새로 추가할 내용이 없었어요 (이미 다 있어요)';
  },
  merge(target, items, key = 'id') { const have = new Set(target.map(x => x[key])); let n = 0; for (const it of items) { if (!it || have.has(it[key])) continue; target.push(it); have.add(it[key]); n++; } return n; },
  addUnique(list, items) { for (const x of items || []) if (x && !list.includes(x)) list.push(x); },
  async fromDiary(d, prefs, covers) {
    const S = SET(); const out = [];
    const coverMap = new Map(covers.map(c => [c.bookId, c.image]));
    const books = []; for (const b of d.books || []) { const nb = { id: b.id, title: b.title || '', author: b.author || '', genre: b.genre || '', format: b.format || '', platform: b.platform || '', shelfCats: b.shelfCategories || [], status: b.status || '완독', start: b.start || '', finish: b.finish || '', page: b.page ?? '', total: b.total ?? '', rating: b.rating || '', review: b.review || '', quote: b.quote || '', cover: '' };
      if (D.books.some(x => x.id === nb.id)) continue; const img = coverMap.get(b.id) || (String(b.cover || '').startsWith('data:') ? b.cover : ''); if (img) { nb.cover = 'cover-' + b.id; await Store.putImg(nb.cover, img); } books.push(nb); }
    out.push(`책 ${this.merge(D.books, books)}권(표지 ${books.filter(b => b.cover).length}장)`);
    out.push(`일정 ${this.merge(D.events, (d.events || []).map(e => ({ id: e.id, title: e.title, date: e.date, time: e.time || '', category: e.category || '일상', reviewStatus: e.reviewStatus || '', reviewSource: e.reviewSource || '', note: e.note || '', repeat: e.repeat || '없음' })))}개`);
    out.push(`할 일 ${this.merge(D.tasks, (d.tasks || []).map(t => ({ id: t.id, title: t.title, date: t.date || '', area: 'life', priority: t.priority || '보통', repeat: t.repeat || '없음', done: !!t.done, originalDate: t.originalDate || '' })))}개`);
    out.push(`가계부 ${this.merge(D.money, (d.money || []).map(m => ({ id: m.id, date: m.date, type: m.type === '수입' ? '수입' : '지출', category: m.category || '기타', title: m.title || '', amount: num(m.amount), method: '', memo: '' })))}건`);
    this.merge(D.study, (d.study || []).map(s => ({ id: s.id, date: s.date, subject: s.subject || s.category || '기타', minutes: num(s.minutes), note: s.note || '' })));
    this.merge(D.journals, (d.journals || []).map(j => ({ id: j.id, date: j.date, title: j.title || '', content: j.content || j.body || '', mood: j.mood || '' })));
    this.merge(D.wrongNotes, (d.wrongNotes || []).map(w => ({ id: w.id, date: w.date, title: w.title, status: w.status || '복습 필요', feedback: w.feedback || '', main: w.mainCategory || '', sub: w.subCategory || '', blocks: [] })));
    if (prefs && Object.keys(prefs).length) { const r = S.reading;
      if (prefs.readingGoal) r.goal = prefs.readingGoal; this.addUnique(r.platforms, prefs.platformOptions); this.addUnique(r.genres, prefs.genreOptions); this.addUnique(S.study.subjects, prefs.studyCategories);
      if (prefs.moneyCategories) { this.addUnique(S.money.cats['지출'], prefs.moneyCategories['지출']); this.addUnique(S.money.cats['수입'], prefs.moneyCategories['수입']); }
      if (prefs.appName) S.profile.name = prefs.appName; if (prefs.receiptBrand) r.receipt.brand = prefs.receiptBrand; if (prefs.receiptTitle) r.receipt.title = prefs.receiptTitle; if (prefs.receiptFooter) r.receipt.footer = prefs.receiptFooter;
      ['Author', 'Pages', 'Dates'].forEach(k => { if (typeof prefs['receiptShow' + k] === 'boolean') r.receipt['show' + k] = prefs['receiptShow' + k]; }); out.push('설정 반영'); }
    this.addUnique(S.reading.shelfCats, D.books.flatMap(b => b.shelfCats || []));
    return out.join(' · ');
  },
  async fromRpg(st) {
    const P = k => { try { return JSON.parse(st[k] || 'null'); } catch { return null; } }; const out = []; const S = SET();
    const dia = P('yellow-diary-v1'), prefs = P('yellow-diary-preferences-v1'); if (dia) out.push(await this.fromDiary(dia, prefs || {}, []));
    const g = P('cozy-village-life-v1');
    if (g) { const G = D.game; G.xp = Math.max(G.xp, num(g.xp)); G.coins = Math.max(G.coins, num(g.coins)); G.activity = Math.max(G.activity, num(g.activityPoints));
      if (Array.isArray(g.farmPlots) && G.plots.every(p => !p)) G.plots = Array.from({ length: 9 }, (_, i) => g.farmPlots[i] ? { crop: g.farmPlots[i].crop, plantedAt: g.farmPlots[i].plantedAt, activityStart: num(g.farmPlots[i].activityStart) } : null);
      for (const [k, v] of Object.entries(g.seeds || {})) G.seeds[k] = Math.max(G.seeds[k] || 0, v); for (const [k, v] of Object.entries(g.harvest || {})) G.harvest[k] = Math.max(G.harvest[k] || 0, v);
      const qn = this.merge(G.quests, (g.customQuests || []).map(q => ({ id: q.id, name: q.name, category: q.category || '', xp: num(q.xp), coins: num(q.coins), period: q.repeat === 'none' && q.period === 'monthly' ? 'monthly' : (q.period || 'daily') })));
      for (const l of g.questLogs || []) { const id = String(l.key).split('|')[0]; const q = G.quests.find(x => x.id === id); const key = id + '|' + Game.periodKey(q?.period || l.period || 'daily', l.date); if (!G.questLogs.some(x => x.key === key)) G.questLogs.push({ key, date: l.date, name: l.name, xp: l.xp, coins: l.coins }); }
      this.merge(G.realRewards, g.realRewards || []); for (const r of g.rewardLogs || []) G.rewardLogs.push(r);
      if (!G.log.length) G.log = (g.rewards || []).map(r => ({ date: r.date, reason: r.reason, xp: r.xp, coins: r.coins }));
      this.addUnique(G.attendance, g.attendance); this.addUnique(S.study.subjects, g.subjects);
      this.merge(D.study, (g.study || []).map(s => ({ id: s.id, date: s.date, subject: s.subject, minutes: num(s.minutes), note: s.note || '' })));
      out.push(`게임(Lv·코인·농장·퀘스트 ${qn}개)`); }
    const enh = P('record-enhancements-2026-v1'); if (enh) { this.addUnique(D.noteFolders, enh.folders); out.push(`메모 ${this.merge(D.notes, (enh.notes || []).map(n => ({ id: n.id, folder: n.folder || '기본', title: n.title || '', body: n.body || '', images: [], updated: today() })))}개`); }
    const cats = P('diary-wrong-categories-v1'); if (cats) for (const [k, v] of Object.entries(cats)) { S.study.wrongCats[k] ||= []; this.addUnique(S.study.wrongCats[k], v); }
    const wn = P('diary-standalone-wrongnotes-v1'); if (Array.isArray(wn)) { const items = []; for (const w of wn) { if (D.wrongNotes.some(x => x.id === w.id)) continue; const blocks = []; for (const b of w.blocks || []) { let img = ''; if (String(b.image || '').startsWith('data:')) { img = 'img-' + uid(); await Store.putImg(img, b.image); } blocks.push({ text: b.text || '', img }); }
      items.push({ id: w.id, date: w.date, title: w.title || '', main: w.mainCategory || '', sub: w.subCategory || '', status: w.status || '복습 필요', feedback: w.feedback || '', blocks }); } out.push(`오답노트 ${this.merge(D.wrongNotes, items)}개`); }
    const vc = P('language-vocab-2026-v1'); if (vc) { let skipped = 0; for (const L of ['en', 'ja']) { const have = new Set(D.vocab[L].map(w => w.word)); for (const w of vc[L] || []) { if (!w.word || have.has(w.word)) continue; if (!fitsLang(L, w.word)) { skipped++; continue; } D.vocab[L].push({ id: String(w.id || uid()), word: w.word, reading: w.reading || '', meaning: w.meaning || '' }); have.add(w.word); } }
      out.push(`단어 일본어 ${D.vocab.ja.length}개·영어 ${D.vocab.en.length}개${skipped ? ` (영어 칸에 잘못 들어간 일본어 ${skipped}개 정리)` : ''}`); }
    return out.join(' · ');
  },
  async fromWork(j) {
    const w = W(), S = SET(); const out = [];
    for (const [k, v] of Object.entries(j.images || {})) await Store.putImg(k, v);
    Object.assign(w.company, Object.fromEntries(Object.entries(j.company || {}).filter(([, v]) => v)));
    if (j.profile) { const p = S.profile; if (!p.company) p.company = j.profile.company || ''; if (!p.joinDate) p.joinDate = j.profile.joinDate || ''; }
    out.push(`거래처 ${this.merge(w.clients, j.clients || [])}곳`); out.push(`신고 ${this.merge(w.filings, j.filings || [])}건`);
    out.push(`할 일 ${this.merge(D.tasks, (j.tasks || []).map(t => ({ ...t, priority: '보통', repeat: '없음' })))}개`); out.push(`메모 ${this.merge(w.memos, j.memos || [])}개`); this.merge(w.calls, j.calls || []);
    out.push(`일정 ${this.merge(D.events, j.events || [])}개`); out.push(`식사 ${this.merge(D.meals, j.meals || [])}건`);
    for (const [k, v] of Object.entries(j.filingStatuses || {})) if (v?.length) S.work.statuses[k] = v;
    for (const e of j.events || []) if (!S.calendar.cats.some(c => c.name === e.category)) S.calendar.cats.push({ name: e.category, color: '#a5c8ec' });
    const tags = new Map((j.tasks || []).filter(t => t.tag).map(t => [t.tag, t.tagColor])); for (const [n, c] of tags) if (!S.work.tags.some(t => t.name === n)) S.work.tags.push({ name: n, color: c || '#a5c8ec' });
    return out.join(' · ');
  }
};

</script>
